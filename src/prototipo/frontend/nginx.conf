server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Mesmos prefixos do proxy do Vite em desenvolvimento.
  location /api/monolito/ { proxy_pass http://api-monolito:3001/; }
  location /api/camadas/  { proxy_pass http://api-camadas:3002/; }
  location /api/clean/    { proxy_pass http://api-clean:3003/; }
  location /bench/        { proxy_pass http://bench:3000/; proxy_read_timeout 300s; }

  location / { try_files $uri /index.html; }
}
